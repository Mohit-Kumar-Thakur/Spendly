<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Spendly - learning Claude Code, one spec at a time">
  <title>Spendly</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0D1626"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E2C44" stroke-width="1"/>
    </pattern>

    <clipPath id="typeClip">
      <rect x="112" y="196" width="0" height="34">
        <animate attributeName="width" from="0" to="600" dur="2.4s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="960" cy="170" rx="300" ry="200" fill="url(#glow)"/>

  <!-- brand mark -->
  <g transform="translate(112 96)">
    <path d="M0 -26 L22 0 L0 26 L-22 0 Z" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="rotate" values="0;180;360" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -26 L22 0 L0 26 L-22 0 Z" fill="none" stroke="#34D399" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.9;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="160" y="116" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="url(#shimmer)">Spendly</text>

  <text x="164" y="158" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#5E7396" letter-spacing="4">TRACK EVERY RUPEE</text>

  <!-- typed tagline -->
  <g clip-path="url(#typeClip)">
    <text x="112" y="222" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="24" fill="#CBD5E1">Learning Claude Code, one spec at a time.</text>
  </g>
  <rect x="112" y="198" width="3" height="30" fill="#34D399">
    <animate attributeName="x" from="112" to="712" dur="2.4s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- stack chips -->
  <g font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7C8FB0">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.0s" fill="freeze"/>
      <rect x="112" y="258" width="76" height="30" rx="15" fill="#152134" stroke="#243449"/>
      <text x="150" y="278" text-anchor="middle">Flask</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.15s" fill="freeze"/>
      <rect x="200" y="258" width="86" height="30" rx="15" fill="#152134" stroke="#243449"/>
      <text x="243" y="278" text-anchor="middle">SQLite</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.3s" fill="freeze"/>
      <rect x="298" y="258" width="78" height="30" rx="15" fill="#152134" stroke="#243449"/>
      <text x="337" y="278" text-anchor="middle">Jinja2</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.45s" fill="freeze"/>
      <rect x="388" y="258" width="124" height="30" rx="15" fill="#152134" stroke="#243449"/>
      <text x="450" y="278" text-anchor="middle">No ORM</text>
    </g>
  </g>

  <!-- animated bar chart -->
  <g transform="translate(800 0)">
    <line x1="0" y1="262" x2="320" y2="262" stroke="#243449" stroke-width="2"/>

    <rect x="14" y="262" width="42" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;74;62;74" dur="3.4s" begin="0.2s" fill="freeze"/>
      <animate attributeName="y" values="262;188;200;188" dur="3.4s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="72" y="262" width="42" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;126;112;126" dur="3.4s" begin="0.35s" fill="freeze"/>
      <animate attributeName="y" values="262;136;150;136" dur="3.4s" begin="0.35s" fill="freeze"/>
    </rect>
    <rect x="130" y="262" width="42" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;92;104;92" dur="3.4s" begin="0.5s" fill="freeze"/>
      <animate attributeName="y" values="262;170;158;170" dur="3.4s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="188" y="262" width="42" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;166;150;166" dur="3.4s" begin="0.65s" fill="freeze"/>
      <animate attributeName="y" values="262;96;112;96" dur="3.4s" begin="0.65s" fill="freeze"/>
    </rect>
    <rect x="246" y="262" width="42" height="0" rx="6" fill="#22D3EE">
      <animate attributeName="height" values="0;118;130;118" dur="3.4s" begin="0.8s" fill="freeze"/>
      <animate attributeName="y" values="262;144;132;144" dur="3.4s" begin="0.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- floating coins -->
  <g fill="#34D399" opacity="0.7">
    <circle cx="700" cy="300" r="7">
      <animate attributeName="cy" values="300;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="300" r="5">
      <animate attributeName="cy" values="300;60" dur="6.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="300" r="6">
      <animate attributeName="cy" values="300;70" dur="5.6s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="5.6s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="300" r="4">
      <animate attributeName="cy" values="300;90" dur="7s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="336" width="1200" height="4" fill="url(#shimmer)"/>
</svg>
